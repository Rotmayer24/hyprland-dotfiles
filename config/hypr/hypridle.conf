general {
    lock_cmd = qs ipc call luci lock
    before_sleep_cmd = qs ipc call luci lock
    after_sleep_cmd = qs ipc call luci showBar
}

listener {
    timeout = 300
    on-timeout = qs ipc call luci lock
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
